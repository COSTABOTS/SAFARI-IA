<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Safari-IA</title>

<style>

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #f5e7dc;
}

.wrapper {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}

iframe {
  width: 100%;
  height: 100%;
  border: none;
}

body::after {
  content: "";
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 57px;
  background: #FEF1E1;
  z-index: 999999;
  pointer-events: none;
}

</style>
</head>

<body>

<div class="wrapper">
  <iframe src="https://typebot.co/my-typebot-b52s7gh"></iframe>
</div>

<script>
history.pushState(null, null, location.href);

window.onpopstate = function () {
  history.go(1);
};
</script>

</body>
</html>
